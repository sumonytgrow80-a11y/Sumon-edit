<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080d">
<meta name="description" content="SUMON EDIT — Professional Video Editor Portfolio">
<title>SUMON EDIT — Professional Video Editor</title>

<style>
/* =========================================================
   SUMON EDIT — PREMIUM VIDEO EDITOR PORTFOLIO
   ========================================================= */

:root{
  --bg:#07080d;
  --bg2:#0b0d15;
  --panel:#10131d;
  --panel2:#141827;
  --text:#f5f7ff;
  --muted:#9da5ba;
  --line:rgba(255,255,255,.09);
  --purple:#8d7cff;
  --blue:#54b8ff;
  --cyan:#55e5ff;
  --pink:#c77dff;
  --green:#55e6a5;
  --radius:24px;
  --max:1180px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(91,72,255,.13),transparent 28%),
    radial-gradient(circle at 90% 25%,rgba(45,180,255,.09),transparent 28%),
    linear-gradient(180deg,#07080d 0%,#080a11 45%,#06070b 100%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
  line-height:1.6;
}

body.menu-open{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

img{
  max-width:100%;
}

::selection{
  background:rgba(141,124,255,.35);
  color:white;
}

/* =========================================================
   PRELOADER
   ========================================================= */

#preloader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#07080d;
  transition:opacity .8s var(--ease),visibility .8s;
}

#preloader.hide{
  opacity:0;
  visibility:hidden;
}

.loader{
  width:90px;
  text-align:center;
}

.loader-logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:20px;
}

.loader-logo span{
  color:var(--purple);
}

.loader-line{
  height:2px;
  width:100%;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  border-radius:10px;
}

.loader-line span{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan));
  animation:loader 1.5s ease forwards;
}

@keyframes loader{
  to{width:100%}
}

/* =========================================================
   BACKGROUND EFFECTS
   ========================================================= */

.background{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-1;
}

.blob{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(90px);
  opacity:.11;
  animation:blobMove 14s ease-in-out infinite alternate;
}

.blob.one{
  background:#755cff;
  top:-180px;
  left:-150px;
}

.blob.two{
  background:#18bfff;
  right:-180px;
  top:30%;
  animation-delay:-5s;
}

.blob.three{
  background:#d34dff;
  left:25%;
  bottom:-240px;
  animation-delay:-9s;
}

@keyframes blobMove{
  0%{
    transform:translate3d(0,0,0) scale(1);
  }
  100%{
    transform:translate3d(80px,-50px,0) scale(1.15);
  }
}

.grid-bg{
  position:absolute;
  inset:0;
  opacity:.035;
  background-image:
    linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}

.noise{
  position:absolute;
  inset:0;
  opacity:.018;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

/* =========================================================
   CONTAINER
   ========================================================= */

.container{
  width:min(calc(100% - 40px),var(--max));
  margin:auto;
}

section{
  position:relative;
  padding:120px 0;
  scroll-margin-top:90px;
}

/* =========================================================
   NAVBAR
   ========================================================= */

.nav-wrap{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  transition:.4s var(--ease);
}

.nav-wrap.scrolled{
  background:rgba(7,8,13,.76);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
}

.nav{
  width:min(calc(100% - 40px),var(--max));
  height:82px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.5px;
}

.logo span{
  color:var(--purple);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:34px;
}

.nav-links a{
  position:relative;
  color:#b9bfd0;
  font-size:14px;
  font-weight:700;
  transition:.3s ease;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-8px;
  width:0;
  height:2px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--purple),var(--blue));
  transition:.35s var(--ease);
}

.nav-links a:hover,
.nav-links a.active{
  color:white;
}

.nav-links a:hover::after,
.nav-links a.active::after{
  width:100%;
}

.nav-contact{
  padding:11px 18px;
  border:1px solid rgba(141,124,255,.35);
  border-radius:14px;
  background:rgba(141,124,255,.08);
}

.nav-contact::after{
  display:none;
}

.menu-btn{
  display:none;
  width:46px;
  height:46px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.04);
  cursor:pointer;
  position:relative;
}

.menu-btn span{
  position:absolute;
  width:21px;
  height:2px;
  left:12px;
  background:white;
  transition:.35s var(--ease);
}

.menu-btn span:nth-child(1){top:15px}
.menu-btn span:nth-child(2){top:22px}
.menu-btn span:nth-child(3){top:29px}

.menu-btn.open span:nth-child(1){
  top:22px;
  transform:rotate(45deg);
}

.menu-btn.open span:nth-child(2){
  opacity:0;
  transform:translateX(10px);
}

.menu-btn.open span:nth-child(3){
  top:22px;
  transform:rotate(-45deg);
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
  min-height:100vh;
  padding-top:150px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.02fr .98fr;
  gap:70px;
  align-items:center;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border:1px solid rgba(141,124,255,.25);
  border-radius:100px;
  background:rgba(141,124,255,.07);
  color:#a9a0ff;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:28px;
  box-shadow:0 0 40px rgba(141,124,255,.08);
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 16px var(--green);
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.45);opacity:.65}
}

.hero h1{
  font-size:clamp(48px,7vw,86px);
  line-height:.98;
  letter-spacing:-4px;
  font-weight:900;
  max-width:800px;
}

.gradient-text{
  background:linear-gradient(100deg,#fff 0%,#aa9cff 38%,#68c9ff 75%,#fff 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:gradientText 5s linear infinite;
}

@keyframes gradientText{
  to{background-position:220% center}
}

.hero-description{
  margin-top:30px;
  max-width:640px;
  color:var(--muted);
  font-size:18px;
  line-height:1.85;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:38px;
}

.btn{
  position:relative;
  min-height:56px;
  padding:0 26px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  border-radius:17px;
  font-weight:800;
  cursor:pointer;
  overflow:hidden;
  transition:.4s var(--ease);
}

.btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);
  transition:.7s ease;
}

.btn:hover::before{
  left:140%;
}

.btn:hover{
  transform:translateY(-5px);
}

.btn-primary{
  color:#090a0f;
  background:white;
  box-shadow:0 15px 45px rgba(255,255,255,.12);
}

.btn-primary:hover{
  box-shadow:0 20px 55px rgba(255,255,255,.18);
}

.btn-secondary{
  color:white;
  border:1px solid rgba(141,124,255,.4);
  background:rgba(141,124,255,.08);
}

.btn-secondary:hover{
  border-color:rgba(141,124,255,.8);
  box-shadow:0 15px 50px rgba(141,124,255,.16);
}

.arrow{
  transition:.35s var(--ease);
}

.btn:hover .arrow{
  transform:translateX(6px);
}

/* =========================================================
   HERO PHOTO
   ========================================================= */

.photo-stage{
  position:relative;
  width:min(100%,510px);
  margin:auto;
  perspective:1000px;
}

.photo-orbit{
  position:absolute;
  inset:-28px;
  border:1px solid rgba(141,124,255,.2);
  border-radius:40px;
  transform:rotate(-4deg);
  animation:orbitFloat 7s ease-in-out infinite;
}

.photo-orbit::before{
  content:"";
  position:absolute;
  inset:25px;
  border:1px solid rgba(84,184,255,.12);
  border-radius:32px;
}

@keyframes orbitFloat{
  0%,100%{transform:rotate(-4deg) translateY(0)}
  50%{transform:rotate(-1deg) translateY(-10px)}
}

.photo-glow{
  position:absolute;
  width:70%;
  height:70%;
  left:15%;
  top:15%;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  filter:blur(90px);
  opacity:.22;
  animation:glowPulse 5s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{transform:scale(.9);opacity:.18}
  50%{transform:scale(1.12);opacity:.3}
}

.photo-box{
  position:relative;
  z-index:2;
  padding:12px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:36px;
  background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
  box-shadow:
    0 35px 100px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);
  transform:rotate(1deg);
  animation:photoFloat 6s ease-in-out infinite;
}

@keyframes photoFloat{
  0%,100%{transform:rotate(1deg) translateY(0)}
  50%{transform:rotate(-1deg) translateY(-9px)}
}

.photo-inner{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  aspect-ratio:4/5;
  background:#0d0f17;
}

.photo-inner::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg,rgba(255,255,255,.12),transparent 25%,transparent 70%,rgba(84,184,255,.08));
  pointer-events:none;
}

.photo-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 25%;
  display:block;
  transition:transform 1s var(--ease),filter 1s var(--ease);
}

.photo-box:hover .photo-inner img{
  transform:scale(1.035);
  filter:saturate(1.08);
}

.photo-badge{
  position:absolute;
  left:24px;
  bottom:24px;
  z-index:4;
  padding:12px 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;
  background:rgba(6,7,12,.72);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
}

/* =========================================================
   SECTION HEADERS
   ========================================================= */

.section-head{
  max-width:720px;
  margin-bottom:55px;
}

.eyebrow{
  color:#9e91ff;
  font-size:13px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:14px;
}

.section-head h2{
  font-size:clamp(38px,5vw,62px);
  line-height:1;
  letter-spacing:-2.5px;
  margin-bottom:20px;
}

.section-head p{
  color:var(--muted);
  font-size:17px;
  line-height:1.8;
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-grid{
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:60px;
  align-items:start;
}

.about-visual{
  min-height:400px;
  position:relative;
  border:1px solid var(--line);
  border-radius:30px;
  background:
    radial-gradient(circle at 25% 25%,rgba(141,124,255,.18),transparent 35%),
    linear-gradient(145deg,#111522,#090b11);
  overflow:hidden;
}

.about-visual::before{
  content:"SUMON";
  position:absolute;
  font-size:clamp(70px,10vw,140px);
  font-weight:1000;
  color:rgba(255,255,255,.025);
  left:-10px;
  bottom:35px;
  letter-spacing:-8px;
}

.about-ring{
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  border:1px solid rgba(141,124,255,.35);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:spin 18s linear infinite;
}

.about-ring::before,
.about-ring::after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 25px var(--purple);
}

.about-ring::before{
  top:-5px;
  left:50%;
}

.about-ring::after{
  right:10px;
  bottom:25px;
  background:var(--blue);
  box-shadow:0 0 25px var(--blue);
}

@keyframes spin{
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

.about-center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:28px;
}

.about-copy{
  color:#b5bdce;
  font-size:17px;
  line-height:1.9;
}

.about-copy p + p{
  margin-top:22px;
}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:30px;
}

.mini-card{
  padding:20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.025);
  transition:.4s var(--ease);
}

.mini-card:hover{
  transform:translateY(-5px);
  border-color:rgba(141,124,255,.35);
  background:rgba(141,124,255,.06);
}

.mini-card strong{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.mini-card span{
  color:var(--muted);
  font-size:13px;
}

/* =========================================================
   SERVICES
   ========================================================= */

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.service-card{
  position:relative;
  min-height:240px;
  padding:28px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  transition:.5s var(--ease);
}

.service-card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-100px;
  right:-90px;
  border-radius:50%;
  background:var(--purple);
  filter:blur(70px);
  opacity:0;
  transition:.5s ease;
}

.service-card:hover{
  transform:translateY(-9px);
  border-color:rgba(141,124,255,.35);
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.service-card:hover::before{
  opacity:.18;
}

.service-number{
  color:#777f94;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
}

.service-icon{
  width:52px;
  height:52px;
  margin:25px 0;
  display:grid;
  place-items:center;
  border:1px solid rgba(141,124,255,.25);
  border-radius:16px;
  background:rgba(141,124,255,.08);
  font-size:22px;
  transition:.5s var(--ease);
}

.service-card:hover .service-icon{
  transform:rotate(-6deg) scale(1.08);
  box-shadow:0 0 30px rgba(141,124,255,.15);
}

.service-card h3{
  font-size:20px;
  margin-bottom:10px;
}

.service-card p{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

/* =========================================================
   TOOLS
   ========================================================= */

.tools-section{
  overflow:hidden;
}

.tools-track{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
}

.tool{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 20px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.025);
  color:#dce1ee;
  font-weight:800;
  transition:.4s var(--ease);
}

.tool:hover{
  transform:translateY(-5px);
  border-color:rgba(84,184,255,.4);
  box-shadow:0 15px 40px rgba(84,184,255,.08);
}

.tool-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 14px rgba(84,184,255,.55);
}

/* =========================================================
   PORTFOLIO
   ========================================================= */

.portfolio-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}

.project{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:28px;
  background:#0e1119;
  transition:.5s var(--ease);
}

.project:hover{
  transform:translateY(-9px);
  border-color:rgba(141,124,255,.35);
  box-shadow:0 30px 80px rgba(0,0,0,.38);
}

.project-preview{
  position:relative;
  height:330px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 30%,rgba(141,124,255,.22),transparent 30%),
    radial-gradient(circle at 75% 70%,rgba(84,184,255,.17),transparent 30%),
    linear-gradient(135deg,#101421,#080a10);
}

.project-preview::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg,transparent 25%,rgba(255,255,255,.05) 50%,transparent 75%);
  transform:translateX(-100%);
  transition:1s var(--ease);
}

.project:hover .project-preview::before{
  transform:translateX(100%);
}

.preview-text{
  position:relative;
  z-index:2;
  color:#8992a8;
  font-weight:900;
  letter-spacing:2px;
  font-size:15px;
}

.play-circle{
  position:absolute;
  z-index:3;
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
  transition:.45s var(--ease);
}

.project:hover .play-circle{
  transform:scale(1.1);
  background:rgba(141,124,255,.18);
  box-shadow:0 0 40px rgba(141,124,255,.2);
}

.project-info{
  padding:25px;
}

.project-info h3{
  font-size:23px;
  margin-bottom:8px;
}

.project-info p{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  margin-bottom:20px;
}

.project-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:900;
  color:#a99fff;
}

.project-link span{
  transition:.3s var(--ease);
}

.project-link:hover span{
  transform:translateX(5px);
}

/* =========================================================
   PROCESS
   ========================================================= */

.process{
  position:relative;
}

.process-list{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
  position:relative;
}

.process-list::before{
  content:"";
  position:absolute;
  top:32px;
  left:7%;
  right:7%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(141,124,255,.4),rgba(84,184,255,.4),transparent);
}

.process-item{
  position:relative;
  z-index:2;
  text-align:center;
}

.process-number{
  width:64px;
  height:64px;
  margin:0 auto 25px;
  display:grid;
  place-items:center;
  border:1px solid rgba(141,124,255,.28);
  border-radius:50%;
  background:#0c0f17;
  color:#a99fff;
  font-weight:900;
  box-shadow:0 0 0 8px rgba(7,8,13,.8);
  transition:.5s var(--ease);
}

.process-item:hover .process-number{
  transform:translateY(-7px) scale(1.08);
  border-color:var(--purple);
  box-shadow:
    0 0 0 8px rgba(7,8,13,.8),
    0 0 35px rgba(141,124,255,.25);
}

.process-item h3{
  font-size:16px;
  margin-bottom:8px;
}

.process-item p{
  color:var(--muted);
  font-size:13px;
}
