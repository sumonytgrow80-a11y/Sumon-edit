<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070709">
<meta name="description" content="SUMON EDIT — Professional Video Editor specializing in cinematic editing, motion graphics, documentary storytelling and short-form content.">

<title>SUMON EDIT — Professional Video Editor</title>

<!-- Premium Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#050506;
  --bg-soft:#09090c;
  --surface:#101014;
  --surface-2:#15151b;
  --surface-3:#1b1b22;

  --white:#ffffff;
  --text:#f4f4f7;
  --muted:#a4a4ae;
  --muted-2:#777781;

  --red:#ff2035;
  --red-dark:#c90c20;
  --red-soft:rgba(255,32,53,.16);
  --purple:#8c52ff;
  --purple-soft:rgba(140,82,255,.14);

  --border:rgba(255,255,255,.09);
  --border-light:rgba(255,255,255,.14);

  --shadow:0 30px 80px rgba(0,0,0,.55);
  --glow-red:0 0 45px rgba(255,32,53,.20);
  --glow-purple:0 0 45px rgba(140,82,255,.16);

  --radius:22px;
  --container:1180px;
}

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:90px;
}

body{
  background:
    radial-gradient(circle at 90% 5%, rgba(255,32,53,.06), transparent 25%),
    radial-gradient(circle at 5% 50%, rgba(140,82,255,.045), transparent 28%),
    var(--bg);

  color:var(--text);
  font-family:'Inter',Arial,sans-serif;
  overflow-x:hidden;
  line-height:1.6;
}

body::selection{
  background:var(--red);
  color:#fff;
}

img{
  max-width:100%;
  display:block;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

ul{
  list-style:none;
}

/* =========================================================
   BACKGROUND EFFECTS
========================================================= */

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9998;
  opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}

.cursor-glow{
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,32,53,.075),transparent 68%);
  transform:translate(-50%,-50%);
  z-index:0;
  transition:left .12s ease-out,top .12s ease-out;
}

@media(max-width:700px){
  .cursor-glow{
    display:none;
  }
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
  width:min(var(--container),92%);
  margin:auto;
}

/* =========================================================
   NAVBAR
========================================================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:78px;
  z-index:5000;

  display:flex;
  align-items:center;

  background:rgba(5,5,6,.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,.065);

  transition:
    background .3s ease,
    box-shadow .3s ease,
    height .3s ease;
}

header.scrolled{
  background:rgba(5,5,6,.92);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.nav-inner{
  width:min(var(--container),92%);
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-family:'Manrope',sans-serif;
  font-size:1.42rem;
  font-weight:900;
  letter-spacing:2.5px;
  white-space:nowrap;
}

.logo .edit{
  color:var(--red);
  text-shadow:0 0 22px rgba(255,32,53,.38);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:34px;
}

.nav-links a{
  position:relative;
  color:#a9a9b1;
  font-size:.78rem;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  transition:.3s ease;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-9px;
  width:0;
  height:2px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--red),var(--purple));
  box-shadow:0 0 12px rgba(255,32,53,.5);
  transition:.35s ease;
}

.nav-links a:hover{
  color:#fff;
}

.nav-links a:hover::after{
  width:100%;
}

.menu-btn{
  width:46px;
  height:46px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(255,255,255,.035);

  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:5px;

  cursor:pointer;
}

.menu-btn span{
  width:21px;
  height:2px;
  border-radius:10px;
  background:#fff;
  transition:.3s ease;
}

.menu-btn.active span:nth-child(1){
  transform:translateY(7px) rotate(45deg);
}

.menu-btn.active span:nth-child(2){
  opacity:0;
}

.menu-btn.active span:nth-child(3){
  transform:translateY(-7px) rotate(-45deg);
}

/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:100vh;
  padding:150px 0 90px;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  top:-270px;
  right:-220px;
  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(255,32,53,.13),
    rgba(255,32,53,.035) 38%,
    transparent 70%
  );

  pointer-events:none;
}

.hero::after{
  content:"";
  position:absolute;
  width:650px;
  height:650px;
  left:-400px;
  bottom:-400px;
  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(140,82,255,.12),
    transparent 68%
  );

  pointer-events:none;
}

.hero-grid{
  position:relative;
  z-index:2;

  display:grid;
  grid-template-columns:1.05fr .75fr;
  gap:85px;
  align-items:center;
}

.hero-content{
  max-width:680px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;

  margin-bottom:22px;

  color:#ff5262;
  font-size:.75rem;
  font-weight:800;
  letter-spacing:4px;
  text-transform:uppercase;
}

.eyebrow::before{
  content:"";
  width:30px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--red));
}

.hero h1{
  font-family:'Manrope',sans-serif;
  font-size:clamp(3.2rem,7vw,6.2rem);
  line-height:.98;
  letter-spacing:-4px;
  font-weight:900;
  margin-bottom:22px;
}

.hero h1 .white{
  color:#fff;
}

.hero h1 .gradient{
  background:linear-gradient(
    110deg,
    #ff5361 0%,
    #ff2035 38%,
    #9a55ff 100%
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  text-shadow:none;
}

.hero-subtitle{
  font-family:'Manrope',sans-serif;
  font-size:clamp(1.15rem,2vw,1.55rem);
  color:#e2e2e7;
  font-weight:700;
  margin-bottom:17px;
}

.hero-description{
  max-width:650px;
  color:var(--muted);
  font-size:1rem;
  line-height:1.85;
  margin-bottom:27px;
}

.hero-description strong{
  color:#fff;
  font-weight:800;
}

.hero-tags{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:34px;
}

.hero-tag{
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:100px;
  background:rgba(255,255,255,.025);

  color:#c7c7cd;
  font-size:.75rem;
  font-weight:700;

  transition:.3s ease;
}

.hero-tag:hover{
  color:#fff;
  border-color:rgba(255,32,53,.55);
  background:rgba(255,32,53,.06);
  box-shadow:0 0 25px rgba(255,32,53,.1);
  transform:translateY(-2px);
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:13px;
}

.btn{
  min-height:52px;
  padding:0 25px;
  border-radius:12px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  font-size:.78rem;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;

  border:1px solid transparent;
  transition:.35s cubic-bezier(.2,.8,.2,1);
}

.btn-primary{
  background:linear-gradient(135deg,#ff2035,#d50e25);
  color:#fff;
  box-shadow:
    0 12px 35px rgba(255,32,53,.22),
    inset 0 1px 0 rgba(255,255,255,.18);
}

.btn-primary:hover{
  transform:translateY(-4px);
  box-shadow:
    0 20px 45px rgba(255,32,53,.35),
    0 0 30px rgba(255,32,53,.15);
}

.btn-outline{
  border-color:var(--border-light);
  background:rgba(255,255,255,.025);
  color:#fff;
}

.btn-outline:hover{
  transform:translateY(-4px);
  border-color:rgba(255,32,53,.5);
  background:rgba(255,32,53,.06);
  box-shadow:0 18px 35px rgba(0,0,0,.3);
}

.location{
  margin-top:25px;
  color:#7f7f89;
  font-size:.76rem;
  font-weight:600;
  letter-spacing:.8px;
}

.location strong{
  color:#bcbcc4;
}

/* =========================================================
   HERO PHOTO
========================================================= */

.hero-visual{
  position:relative;
  display:flex;
  justify-content:center;
}

.photo-frame{
  width:min(100%,390px);
  aspect-ratio:4 / 5;
  position:relative;

  border-radius:28px;
  padding:1px;

  background:linear-gradient(
    145deg,
    rgba(255,32,53,.75),
    rgba(255,255,255,.08) 35%,
    rgba(140,82,255,.6)
  );

  box-shadow:
    0 35px 90px rgba(0,0,0,.65),
    0 0 60px rgba(255,32,53,.08);

  transform:rotate(1deg);
  transition:.5s ease;
}

.photo-frame:hover{
  transform:rotate(0deg) translateY(-8px);
  box-shadow:
    0 45px 100px rgba(0,0,0,.7),
    0 0 70px rgba(255,32,53,.14);
}

.photo-inner{
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:27px;
  background:#111115;
  position:relative;
}

.photo-inner::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      transparent 45%,
      rgba(0,0,0,.38) 100%
    );

  pointer-events:none;
}

.photo-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-label{
  position:absolute;
  left:-24px;
  bottom:35px;
  z-index:5;

  padding:12px 17px;

  background:rgba(10,10,12,.85);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);

  border-radius:13px;

  box-shadow:0 20px 45px rgba(0,0,0,.45);
}

.photo-label small{
  display:block;
  color:#777781;
  font-size:.63rem;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}

.photo-label strong{
  display:block;
  margin-top:2px;
  color:#fff;
  font-size:.84rem;
}

.photo-orb{
  position:absolute;
  width:120px;
  height:120px;
  right:-45px;
  top:-45px;
  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(255,32,53,.35),
    transparent 65%
  );

  filter:blur(8px);
}

/* =========================================================
   SECTION COMMON
========================================================= */

.section{
  position:relative;
  padding:115px 0;
}

.section-header{
  max-width:720px;
  margin-bottom:48px;
}

.section-label{
  color:#ff4b5b;
  font-size:.72rem;
  font-weight:800;
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.section-title{
  font-family:'Manrope',sans-serif;
  font-size:clamp(2.2rem,5vw,3.5rem);
  line-height:1.05;
  letter-spacing:-2px;
  font-weight:900;
}

.section-title span{
  color:#fff;
}

.section-title .accent{
  color:var(--red);
  text-shadow:0 0 25px rgba(255,32,53,.18);
}

.section-description{
  margin-top:17px;
  max-width:700px;
  color:var(--muted);
  line-height:1.8;
  font-size:.96rem;
}

.divider{
  width:100%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:70px;
  align-items:start;
}

.about-mark{
  font-family:'Manrope',sans-serif;
  font-size:clamp(4rem,9vw,8rem);
  font-weight:900;
  line-height:.8;
  letter-spacing:-7px;

  color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.12);

  user-select:none;
}

.about-content p{
  color:var(--muted);
  font-size:1.05rem;
  line-height:1.95;
  max-width:750px;
}

.about-content p strong{
  color:#fff;
  font-weight:800;
}

.about-points{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:30px;
}

.about-point{
  padding:18px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(255,255,255,.018);
}

.about-point strong{
  display:block;
  color:#fff;
  font-size:.88rem;
  margin-bottom:3px;
}

.about-point span{
  color:#7e7e88;
  font-size:.75rem;
}

/* =========================================================
   SERVICES
========================================================= */

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.service-card{
  min-height:235px;
  padding:29px;

  border:1px solid var(--border);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  position:relative;
  overflow:hidden;

  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    border-color .35s ease,
    box-shadow .35s ease;
}

.service-card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-80px;
  top:-80px;
  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(255,32,53,.15),
    transparent 70%
  );

  opacity:0;
  transition:.4s ease;
}

.service-card:hover{
  transform:translateY(-8px);
  border-color:rgba(255,32,53,.3);
  box-shadow:
    0 25px 55px rgba(0,0,0,.4),
    0 0 35px rgba(255,32,53,.06);
}

.service-card:hover::before{
  opacity:1;
}

.service-number{
  color:#45454e;
  font-size:.7rem;
  font-weight:800;
  letter-spacing:2px;
}

.service-icon{
  width:50px;
  height:50px;
  margin:25px 0 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,32,53,.18);
  border-radius:14px;

  background:rgba(255,32,53,.06);

  font-size:1.25rem;

  box-shadow:0 0 25px rgba(255,32,53,.05);
}

.service-card h3{
  font-family:'Manrope',sans-serif;
  font-size:1.05rem;
  font-weight:800;
  margin-bottom:9px;
}

.service-card p{
  color:#888891;
  font-size:.82rem;
  line-height:1.7;
}

/* =========================================================
   PORTFOLIO
========================================================= */

.portfolio-section{
  overflow:hidden;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:30px;
}

.filter-btn{
  border:1px solid var(--border);
  border-radius:100px;

  background:rgba(255,255,255,.02);
  color:#888891;

  padding:10px 16px;

  font-size:.72rem;
  font-weight:700;

  cursor:pointer;

  transition:.3s ease;
}

.filter-btn:hover,
.filter-btn.active{
  color:#fff;
  border-color:rgba(255,32,53,.5);
  background:rgba(255,32,53,.09);
  box-shadow:0 0 22px rgba(255,32,53,.08);
}

.portfolio-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.project{
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  background:#101014;

  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    border-color .35s ease,
    box-shadow .35s ease;
}

.project.hidden{
  display:none;
}

.project:hover{
  transform:translateY(-8px);
  border-color:rgba(255,32,53,.28);
  box-shadow:0 25px 60px rgba(0,0,0,.48);
}

.project-thumb{
  height:215px;
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(255,32,53,.12),
      transparent 35%
    ),
    linear-gradient(145deg,#15151b,#09090b);
}

.project-thumb::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      125deg,
      transparent 25%,
      rgba(255,255,255,.035) 50%,
      transparent 75%
    );

  transform:translateX(-100%);
  transition:1s ease;
}

.project:hover .project-thumb::before{
  transform:translateX(100%);
}

.placeholder-icon{
  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;

  color:#777781;
  font-size:1.15rem;

  background:rgba(255,255,255,.035);
}

.placeholder-text{
  position:absolute;
  bottom:15px;
  left:15px;

  color:#65656e;
  font-size:.62rem;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.project-body{
  padding:22px;
}

.project-category{
  color:#ff4a5a;
  font-size:.62rem;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.project-body h3{
  font-family:'Manrope',sans-serif;
  font-size:1rem;
  font-weight:800;
  margin-bottom:7px;
}

.project-body p{
  color:#80808a;
  font-size:.78rem;
  line-height:1.65;
  margin-bottom:16px;
}

.watch-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;

  color:#fff;
  font-size:.7rem;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;

  transition:.3s ease;
}

.watch-btn span{
  color:var(--red);
  transition:.3s ease;
}

.watch-btn:hover{
  color:#ff5362;
}

.watch-btn:hover span{
  transform:translateX(5px);
}

/* =========================================================
   SKILLS
========================================================= */

.skills-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
}

.skill{
  padding:13px 18px;

  border:1px solid var(--border);
  border-radius:100px;

  background:rgba(255,255,255,.018);

  color:#c1c1c8;
  font-size:.77rem;
  font-weight:700;

  transition:.3s ease;
}

.skill:hover{
  color:#fff;
  border-color:rgba(140,82,255,.45);
  background:rgba(140,82,255,.06);
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(140,82,255,.08);
}

/* =========================================================
   TOOLS
========================================================= */

.tools-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.tool-card{
  position:relative;

  padding:35px;

  display:flex;
  align-items:center;
  gap:24px;

  border:1px solid var(--border);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  transition:.4s ease;
}

.tool-card:hover{
  transform:translateY(-6px);
  border-color:rgba(255,255,255,.15);
  box-shadow:0 25px 55px rgba(0,0,0,.35);
}

.tool-logo{
  width:70px;
  height:70px;
  object-fit:contain;
  flex-shrink:0;

  border-radius:18px;

  filter:
    drop-shadow(0 10px 25px rgba(0,0,0,.4));
}

/*
  Official-style logo fallbacks.
  If remote logo is unavailable, these remain clean.
*/

.tool-fallback{
  width:70px;
  height:70px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  color:#fff;
  font-family:'Manrope',sans-serif;
  font-size:1.1rem;
  font-weight:900;

  background:
    linear-gradient(135deg,#17171d,#292932);

  border:1px solid rgba(255,255,255,.12);
}

.tool-card h3{
  font-family:'Manrope',sans-serif;
  font-size:1.05rem;
  font-weight:800;
  margin-bottom:5px;
}

.tool-card p{
  color:#7e7e87;
  font-size:.76rem;
}
